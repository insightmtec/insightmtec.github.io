<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fut Hub - Privacy Policy</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;line-height:1.7;max-width:900px;margin:0 auto;padding:20px;color:#333}
.language-selector{position:relative;display:flex;justify-content:flex-end;margin-bottom:20px}
.language-button{border:1px solid #ddd;background:#fff;border-radius:8px;padding:10px 14px;cursor:pointer;display:flex;gap:8px;align-items:center}
.language-menu{display:none;position:absolute;top:48px;right:0;background:#fff;border:1px solid #ddd;border-radius:8px;min-width:180px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.language-item{padding:12px;cursor:pointer}
.language-item:hover{background:#f5f5f5}
h2{border-bottom:1px solid #e5e5e5;padding-bottom:8px;margin-top:30px}
.contact,.consent{background:#f5f5f5;padding:15px;border-radius:8px;margin-top:10px}
</style>
</head>
<body>
<div class="language-selector">
<button class="language-button" onclick="toggleMenu()">
    <img id="flag" src="https://flagcdn.com/w40/br.png" alt="">
    <span id="langName">Português</span>
    <span>▼</span>
</button>
<div class="language-menu" id="menu">
    <div class="language-item" onclick="setLang('pt')">
        <img src="https://flagcdn.com/w40/br.png" alt="Brasil">
        Português
    </div>

    <div class="language-item" onclick="setLang('en')">
        <img src="https://flagcdn.com/w40/us.png" alt="USA">
        English
    </div>

    <div class="language-item" onclick="setLang('es')">
        <img src="https://flagcdn.com/w40/es.png" alt="España">
        Español
    </div>
</div>
</div>

<div id="content"></div>

<script>
const content={
pt:`<h1>Política de Privacidade – Fut Hub</h1>
<p><strong>Última atualização:</strong> 02 de junho de 2026</p>
<p>Bem-vindo ao Fut Hub.</p>
<p>Esta Política de Privacidade descreve como coletamos, usamos, armazenamos e protegemos as informações dos usuários do aplicativo Fut Hub ("Aplicativo", "Serviço", "nós" ou "nosso").</p>
<p>Ao utilizar o Fut Hub, você concorda com as práticas descritas nesta Política de Privacidade.</p>
<h2>1. Informações que coletamos</h2>
<h3>1.1 Informações fornecidas pelo usuário</h3>
<ul><li>Nome de usuário;</li><li>Foto de perfil (quando fornecida);</li></ul>
<h3>1.2 Informações coletadas automaticamente</h3>
<ul><li>Sistema operacional e versão;</li><li>Idioma do dispositivo;</li><li>Informações de desempenho e falhas (crash reports);</li><li>Dados de interação com funcionalidades do aplicativo.</li></ul>
<h3>1.3 Informações de assinatura e pagamentos</h3>
<p>Caso você adquira recursos premium, o processamento do pagamento será realizado pelas plataformas de distribuição de aplicativos.</p>
<p>Não armazenamos informações completas de cartões de crédito ou dados bancários dos usuários.</p>
<h2>2. Como utilizamos suas informações</h2>
<ul><li>Criar seu perfil;</li><li>Permitir a participação em rankings, desafios e competições;</li><li>Personalizar a experiência do usuário;</li><li>Fornecer suporte técnico;</li><li>Melhorar funcionalidades e desempenho do aplicativo;</li><li>Detectar fraudes, abusos ou atividades não autorizadas;</li><li>Cumprir obrigações legais e regulatórias.</li></ul>
<h2>3. Compartilhamento de informações</h2>
<p>Não vendemos dados pessoais dos usuários.</p>
<ul><li>Prestadores de serviços necessários para operação do aplicativo;</li><li>Serviços de hospedagem e banco de dados;</li><li>Serviços de análise e monitoramento;</li><li>Plataformas de anúncios;</li><li>Autoridades governamentais quando exigido por lei.</li></ul>
<h2>4. Serviços de terceiros</h2>
<p>O Fut Hub pode utilizar serviços de terceiros que possuem suas próprias políticas de privacidade, incluindo:</p>
<ul><li>Firebase;</li><li>Google AdMob;</li><li>Google Analytics;</li></ul>
<h2>5. Publicidade</h2><p>O aplicativo pode exibir anúncios fornecidos por parceiros de publicidade.</p>
<h2>6. Armazenamento e segurança</h2><p>Adotamos medidas técnicas e organizacionais razoáveis para proteger as informações dos usuários.</p>
<h2>7. Retenção de dados</h2><ul><li>Fornecer os serviços do aplicativo;</li><li>Cumprir obrigações legais;</li><li>Resolver disputas;</li><li>Fazer cumprir nossos contratos.</li></ul>
<h2>8. Direitos do usuário</h2><ul><li>Acesso aos seus dados;</li><li>Correção de dados incorretos;</li><li>Exclusão de dados pessoais;</li><li>Portabilidade dos dados;</li><li>Revogação de consentimento quando aplicável.</li></ul>
<h2>9. Privacidade de crianças</h2><p>O Fut Hub não é destinado a crianças menores de 13 anos.</p>
<h2>10. Alterações nesta Política</h2><p>Podemos atualizar esta Política de Privacidade periodicamente.</p>
<h2>11. Contato</h2><div class="contact"><p><strong>E-mail:</strong> insightmtec@gmail.com</p></div>
<div class="consent"><h2>Consentimento</h2><p>Ao utilizar o Fut Hub, você declara que leu, compreendeu e concorda com esta Política de Privacidade.</p></div>`,
en:`<h1>Privacy Policy – Fut Hub</h1> <p><strong>Last updated:</strong> June 2, 2026</p> <p>Welcome to Fut Hub.</p> <p>This Privacy Policy describes how we collect, use, store, and protect information from users of the Fut Hub application ("Application", "Service", "we", "our", or "us").</p> <p>By using Fut Hub, you agree to the practices described in this Privacy Policy.</p> <h2>1. Information We Collect</h2> <h3>1.1 Information Provided by the User</h3> <ul> <li>Username;</li> <li>Profile picture (when provided);</li> </ul> <h3>1.2 Information Collected Automatically</h3> <ul> <li>Operating system and version;</li> <li>Device language;</li> <li>Performance and crash information (crash reports);</li> <li>Interaction data related to application features.</li> </ul> <h3>1.3 Subscription and Payment Information</h3> <p>If you purchase premium features, payment processing will be carried out by application distribution platforms.</p> <p>We do not store complete credit card information or users' banking details.</p> <h2>2. How We Use Your Information</h2> <ul> <li>Create your profile;</li> <li>Allow participation in rankings, challenges, and competitions;</li> <li>Personalize the user experience;</li> <li>Provide technical support;</li> <li>Improve application features and performance;</li> <li>Detect fraud, abuse, or unauthorized activities;</li> <li>Comply with legal and regulatory obligations.</li> </ul> <h2>3. Information Sharing</h2> <p>We do not sell users' personal data.</p> <ul> <li>Service providers necessary for application operation;</li> <li>Hosting and database services;</li> <li>Analytics and monitoring services;</li> <li>Advertising platforms;</li> <li>Government authorities when required by law.</li> </ul> <h2>4. Third-Party Services</h2> <p>Fut Hub may use third-party services that have their own privacy policies, including:</p> <ul> <li>Firebase;</li> <li>Google AdMob;</li> <li>Google Analytics;</li> </ul> <h2>5. Advertising</h2> <p>The application may display advertisements provided by advertising partners.</p> <h2>6. Storage and Security</h2> <p>We adopt reasonable technical and organizational measures to protect users' information.</p> <h2>7. Data Retention</h2> <ul> <li>Provide application services;</li> <li>Comply with legal obligations;</li> <li>Resolve disputes;</li> <li>Enforce our agreements.</li> </ul> <h2>8. User Rights</h2> <ul> <li>Access your data;</li> <li>Correct inaccurate data;</li> <li>Delete personal data;</li> <li>Data portability;</li> <li>Withdraw consent when applicable.</li> </ul> <h2>9. Children's Privacy</h2> <p>Fut Hub is not intended for children under 13 years of age.</p> <h2>10. Changes to This Policy</h2> <p>We may update this Privacy Policy periodically.</p> <h2>11. Contact</h2> <div class="contact"> <p><strong>Email:</strong> insightmtec@gmail.com</p> </div> <div class="consent"> <h2>Consent</h2> <p>By using Fut Hub, you declare that you have read, understood, and agreed to this Privacy Policy.</p> </div>`,
es:`<h1>Política de Privacidad – Fut Hub</h1> <p><strong>Última actualización:</strong> 2 de junio de 2026</p> <p>Bienvenido a Fut Hub.</p> <p>Esta Política de Privacidad describe cómo recopilamos, utilizamos, almacenamos y protegemos la información de los usuarios de la aplicación Fut Hub ("Aplicación", "Servicio", "nosotros" o "nuestro").</p> <p>Al utilizar Fut Hub, usted acepta las prácticas descritas en esta Política de Privacidad.</p> <h2>1. Información que recopilamos</h2> <h3>1.1 Información proporcionada por el usuario</h3> <ul> <li>Nombre de usuario;</li> <li>Foto de perfil (cuando se proporcione);</li> </ul> <h3>1.2 Información recopilada automáticamente</h3> <ul> <li>Sistema operativo y versión;</li> <li>Idioma del dispositivo;</li> <li>Información de rendimiento y fallos (informes de errores);</li> <li>Datos de interacción con las funcionalidades de la aplicación.</li> </ul> <h3>1.3 Información sobre suscripciones y pagos</h3> <p>Si adquiere funciones premium, el procesamiento del pago será realizado por las plataformas de distribución de aplicaciones.</p> <p>No almacenamos información completa de tarjetas de crédito ni datos bancarios de los usuarios.</p> <h2>2. Cómo utilizamos su información</h2> <ul> <li>Crear su perfil;</li> <li>Permitir la participación en clasificaciones, desafíos y competiciones;</li> <li>Personalizar la experiencia del usuario;</li> <li>Proporcionar soporte técnico;</li> <li>Mejorar las funcionalidades y el rendimiento de la aplicación;</li> <li>Detectar fraudes, abusos o actividades no autorizadas;</li> <li>Cumplir obligaciones legales y regulatorias.</li> </ul> <h2>3. Compartición de información</h2> <p>No vendemos los datos personales de los usuarios.</p> <ul> <li>Proveedores de servicios necesarios para el funcionamiento de la aplicación;</li> <li>Servicios de alojamiento y bases de datos;</li> <li>Servicios de análisis y monitoreo;</li> <li>Plataformas publicitarias;</li> <li>Autoridades gubernamentales cuando la ley lo exija.</li> </ul> <h2>4. Servicios de terceros</h2> <p>Fut Hub puede utilizar servicios de terceros que cuentan con sus propias políticas de privacidad, incluyendo:</p> <ul> <li>Firebase;</li> <li>Google AdMob;</li> <li>Google Analytics;</li> </ul> <h2>5. Publicidad</h2> <p>La aplicación puede mostrar anuncios proporcionados por socios publicitarios.</p> <h2>6. Almacenamiento y seguridad</h2> <p>Adoptamos medidas técnicas y organizativas razonables para proteger la información de los usuarios.</p> <h2>7. Retención de datos</h2> <ul> <li>Proporcionar los servicios de la aplicación;</li> <li>Cumplir obligaciones legales;</li> <li>Resolver disputas;</li> <li>Hacer cumplir nuestros acuerdos.</li> </ul> <h2>8. Derechos del usuario</h2> <ul> <li>Acceder a sus datos;</li> <li>Corregir datos incorrectos;</li> <li>Eliminar datos personales;</li> <li>Portabilidad de los datos;</li> <li>Retirar el consentimiento cuando corresponda.</li> </ul> <h2>9. Privacidad de los niños</h2> <p>Fut Hub no está destinado a niños menores de 13 años.</p> <h2>10. Cambios en esta Política</h2> <p>Podemos actualizar esta Política de Privacidad periódicamente.</p> <h2>11. Contacto</h2> <div class="contact"> <p><strong>Correo electrónico:</strong> insightmtec@gmail.com</p> </div> <div class="consent"> <h2>Consentimiento</h2> <p>Al utilizar Fut Hub, usted declara que ha leído, comprendido y aceptado esta Política de Privacidad.</p> </div>`
};

const names={
    pt:["https://flagcdn.com/w40/br.png","Português"],
    en:["https://flagcdn.com/w40/us.png","English"],
    es:["https://flagcdn.com/w40/es.png","Español"]
};
    
function toggleMenu(){menu.style.display=menu.style.display==='block'?'none':'block';}
function setLang(lang){
localStorage.setItem('lang',lang);
document.getElementById('content').innerHTML=content[lang];
document.getElementById('flag').src = names[lang][0];
document.getElementById('langName').textContent=names[lang][1];
menu.style.display='none';
}
setLang(localStorage.getItem('lang')||'pt');
</script>
</body>
</html>
