<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convite para liga — Oráculo FC</title>

<!-- Preencha com uma imagem real hospedada no seu site antes de publicar — sem isso o card
     que o WhatsApp/redes sociais mostram ao colar o link fica sem imagem. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Entrar em uma liga no Oráculo FC">
<meta property="og:description" content="Toque para competir nessa liga no melhor app de palpites de futebol!">
<meta property="og:image" content="https://www.insightmobile.com.br/oraculoFC/logo_small.png">

<style>
  :root {
    color-scheme: light dark;
    --bg: #0A0A0A;
    --card: #1D1D1D;
    --border: #252525;
    --text: #FFFFFF;
    --text-secondary: #888888;
    --accent: #C8FF00;
    --accent-fg: #000000;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 24px;
    text-align: center;
  }
  .logo {
    width: 80px;
    height: 80px;
    margin-bottom: 2px;
    border-radius: 16px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 8px;
  }
  p {
    font-size: 14px;
    color: var(--text-secondary);
    margin: 0 0 24px;
    line-height: 1.5;
  }
  .button {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 10px;
    border: none;
  }
  .button.primary {
    background: var(--accent);
    color: var(--accent-fg);
  }
  .button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--accent);
  }
  #open-app { display: none; } /* só aparece se a página achar um código válido na URL */
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://www.insightmobile.com.br/oraculoFC/logo-brilho.png" alt="Oráculo FC">
    <h1>Oráculo FC</h1>
    <p id="message">Você recebeu um convite para entrar numa liga no melhor jogo de palpites de futebol.</p>
    <a id="download-app" class="button primary" href="https://play.google.com/store/apps/details?id=com.insight.oraculofc">
      Baixar o Oráculo FC
    </a>
  </div>

  <script>
    // Traduz os textos visíveis pelo idioma do NAVEGADOR de quem abriu o link (não pelo idioma
    // de quem compartilhou) — mesma ideia do onboarding do app, que pré-seleciona o idioma do
    // aparelho. Os textos de og:title/og:description no <head> ficam fixos em português: quem
    // lê essas tags é o robô do WhatsApp/etc ao gerar o preview do link, que não executa esse
    // JS e não manda um Accept-Language útil — não dá pra traduzir esse card de preview aqui.
    var translations = {
      pt: {
        title: 'Convite para liga — Oráculo FC',
        message: 'Você recebeu um convite para entrar numa liga no melhor jogo de palpites de futebol.',
        invalidMessage: 'Link de convite inválido — peça pra quem te chamou compartilhar de novo.',
        openApp: 'Abrir no app',
        downloadApp: 'Baixar o Oráculo FC',
      },
      en: {
        title: 'League invite — Oráculo FC',
        message: "You've been invited to join a league in the best football prediction game.",
        invalidMessage: 'Invalid invite link — ask whoever invited you to share it again.',
        openApp: 'Open in app',
        downloadApp: 'Get Oráculo FC',
      },
      es: {
        title: 'Invitación a liga — Oráculo FC',
        message: 'Te invitaron a unirte a una liga en el mejor juego de pronósticos de fútbol.',
        invalidMessage: 'Enlace de invitación inválido — pide a quien te invitó que lo comparta de nuevo.',
        openApp: 'Abrir en la app',
        downloadApp: 'Descargar Oráculo FC',
      },
    };
    var lang = ((navigator.language || 'en').slice(0, 2).toLowerCase());
    var t = translations[lang] || translations.en;

    document.documentElement.lang = lang in translations ? lang : 'en';
    document.title = t.title;
    document.getElementById('message').textContent = t.message;
    document.getElementById('open-app').textContent = t.openApp;
    document.getElementById('download-app').textContent = t.downloadApp;

    // O app (ver AndroidManifest.xml) espera o link como
    // https://oraculofc.insightmobile.com.br/oraculoFC/join/{codigo} — se o Android já
    // reconheceu e verificou o domínio, o app abre direto e esta página nunca chega a carregar
    // de verdade. Ela só aparece pra quem não tem o app instalado, ou quando o link é aberto
    // num desktop.
    //
    // IMPORTANTE: pra isso funcionar hospedando este único arquivo (oraculoFC/join/index.html
    // no repo), o servidor do site precisa reescrever (rewrite, não redirect) qualquer
    // requisição de /oraculoFC/join/* pra este arquivo — senão cada código geraria uma URL de
    // arquivo inexistente (404). Se o seu site não tiver esse tipo de regra disponível, me
    // avise que troco o formato do link pra usar /oraculoFC/join?code=... em vez de
    // /oraculoFC/join/... (funciona em qualquer hospedagem, sem precisar de rewrite).
    var parts = window.location.pathname.split('/').filter(Boolean);
    // Caminho fixo é oraculoFC/join/{codigo} — 2 segmentos antes do código de verdade.
    var fromPath = parts.length > 2 ? parts[parts.length - 1] : null;
    var code = fromPath || new URLSearchParams(window.location.search).get('code');

    if (code) {
      var openAppLink = document.getElementById('open-app');
      openAppLink.href = 'oraculofc://join?code=' + encodeURIComponent(code);
      openAppLink.style.display = 'block';
    } else {
      document.getElementById('message').textContent = t.invalidMessage;
    }
  </script>
</body>
</html>
